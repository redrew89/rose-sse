nexusDescription="[center][size=1]﻿[/size][img]https://staticdelivery.nexusmods.com/mods/1704/images/26983/26983-1579287693-1523629409.png[/img]﻿[/center][center][b][i]Lielle is a Breton mage, enchantress and arcane scholar, currently studying at\n<br />the College of Winterhold. She favors Destruction, Alteration and Restoration, and has a keen interest in the study of powerful magical artifacts.[/i][/b][/center][left][size=5]\n<br />﻿[b]NOTE FOR CLARITY:\n<br />\n<br />[/b][/size][size=3]The content of this mod is [i]partially voiced. [/i]While a good portion of Lielle's core dialogue is voiced, much of her commentary is not. The next release will prioritize having fully voiced dialogue, as well as an exciting amount of new features and content. Please, be patient, as it will take JoJo and myself some time to get everything recorded, implemented and tested fully, before release. Please feel free to track this mod, so that you can see updates as soon as they are released. If you do wish to experience Lielle in her current state, be sure to install Fuz Ro D'oh, for unvoiced dialogue subtitles.\n<br />[/size][size=5][b]﻿﻿[/b]\n<br />[b]CONTENT ADVISORY:\n<br />\n<br />[/b][/size][size=4][b]This mod contains content that may not be appropriate for all audiences. Mature themes and topics are explored. While not explicit, the content is emotionally-charged. This content is OPTIONAL, disabled by default, and not required to experience the full scope of content and features currently released. In future releases, the choice to engage with this content will be made more visible to the player, with narrative consequences for their choice.[/b]\n<br />\n<br />Need more context? Read [url=https://www.nexusmods.com/skyrimspecialedition/articles/7569]this article[/url]﻿.\n<br />[/size]\n<br />[size=5][b]\n<br />STANDARD NEXUS DISCLAIMER: Please read the full description before installing this mod. This mod is currently in BETA development. There may be minor bugs, including unvoiced dialogue. Please only report major bugs (broken quests, CTDs*, missing NPCs) when necessary. When reporting, please include mod load order information, preferably via [url=https://modwat.ch/]Modwat.ch[/url]﻿ or crash log. Thank you for reading!\n<br />[/b][/size][size=5][b]\n<br />*[/b][/size][size=2][b] A crash logging utility of some form is suggested for all mod lists, on all versions of Skyrim.\n<br />[/b][/size][center][size=5][b]\n<br />[youtube]mnWQlorcC9o[/youtube] [youtube]unpwUfO3OYc[/youtube][/b][/size][b][size=5][b]\n<br />Starring [url=https://www.patreon.com/jojorawr]JoJoRawr[/url]﻿ [size=1][url=https://www.twitch.tv/jojorawr]@Twitch[/url]﻿ [url=https://twitter.com/JoJoRawr] [/url][url=https://twitter.com/JoJoRawrGaming][/url][url=https://twitter.com/JoJoRawr]@Twitter[/url]﻿﻿\n<br />(Video contains non-default apparel. [url=https://www.nexusmods.com/skyrimspecialedition/mods/21755]West Wind Misfit Mage CBBE[/url]﻿)\n<br />[/size][size=1]\n<br />[size=6]Support Lielle on [url=https://www.patreon.com/redrew89]Patreon[/url]﻿!\n<br />[/size][/size]\n<br />Find behind-the-scenes content and play testing streams on [url=https://www.youtube.com/theredrew89]YouTube[/url]﻿![/b][/size][/b][/center][/left][b][size=4][b]\n<br />[/b][/size][i]   ﻿Lielle - Rose of the North[/i] is a unique custom follower, inspired by the likes of complex companion mods such as Inigo, Lucien, and various \"super followers\" found in Interesting NPCs. She has been carefully designed both within and without to be an engaging companion, fully quest-aware and featuring a complex personality. This mod is currently still in Beta release phase, as it does not contain the full scope of quest-aware dialogue and features. Players are welcome to install this mod and see what Lielle currently has to offer, and mod authors are encouraged to crack open the plugin and scripts to see how she functions, and contribute bug-fixes or other suggestions if they desire. \n<br />\n<br />  [b]  NOTICE OF CHANGE:[/b] Lielle will now be released under an open-permissions license. Mod authors are free to reverse-engineer and borrow any code or assets they choose to, provided credit is given to myself or other contributing mod authors, whose assets and code I have used under same permissions and considerations. Another request I make is that this mod not be re-uploaded to other sites without my authorization.\n<br />\n<br />Borrowed Observation, courtesy of Wrye:\n<br />\n<br />[code]﻿In the [b][i]Cathedral[/i][/b] view, modding is viewed as being like a [b][i]joint effort to build a cathedral.[/i][/b]  Individually, our contributions may be small – and may not be worth doing for themselves. But by each person contributing something, we \n<br />construct something larger and more worthwhile than any of us could do on our own. Under this view, creations are contributions – and may not be taken back. (Just as in building a Cathedral, it would not be allowed\n<br /> for a person to contribute a stained glass window and then later take it back.) \n<br />\n<br /> \n<br />The [b][i]Parlor[/i][/b] view in contrast, is the view that mods are more like [b][i]privately owned works of art displayed in the modder's parlor.[/i][/b] The modder invites others into the parlor to appreciate and enjoy the work of art – but may at any time close the parlor door and ask their guests to leave. And of course, the modder may be very selective about who they invite into their parlor. Under this view, our creations are never contributions; rather we continue to own and control them – takebacks are normal and accepted.\n<br />\n<br /> \n<br />The Parlor view allows the creator to retain complete control of their work. But the Cathedral view creates a much larger, more enduring and more perfected body of work – and for that reason, I prefer it.\n<br />[/code]\n<br />\n<br />\n<br />[center][img]https://staticdelivery.nexusmods.com/mods/1704/images/26983/26983-1579812029-1033374864.png[/img]\n<br />\n<br />\n<br />\n<br />[b]﻿[size=6]Release 0.4.0 Beta Now Released! Major Changes!\n<br />Please review \"Installation and Upgrading\" at the bottom of this page![/size][/b][/center]\n<br />\n<br />[center][img]https://staticdelivery.nexusmods.com/mods/1704/images/26983/26983-1579289019-1875020519.png[/img]﻿[size=5][img]https://staticdelivery.nexusmods.com/mods/1704/images/26983/26983-1579287668-1794234529.png[/img]﻿Features[img]https://staticdelivery.nexusmods.com/mods/1704/images/26983/26983-1579287680-584144625.png[/img]﻿[/size]﻿[/center]\n<br />[list]\n<br />[*]  Arcane Rearch and Study Rank - Novice Level Completed\n<br />[*]  Quest Awareness - Partially Completed\n<br />[*]  Affection Level - Basic Implementation - Major Revisions Coming\n<br />[*]  Multi-follower Support and Interaction - Work-in-Progress - More Planned\n<br />[*]  Unique Voiced Dialogue - Over 400 lines currently, with much more planned.\n<br />[*][s]xVASynth placeholder dialogue.[/s] [url=https://www.nexusmods.com/skyrimspecialedition/articles/7570]Read this[/url]﻿\n<br />[*]  MCM Menu for stat tracking and testing\n<br />[*]  Unique Custom Body and Textures (Requires XPMSSE)\n<br />[*]  Player-Targeted and Self-Targeted Combat Healing - Implemented; can be disabled in favor of other solutions, such as NFF's party healing option.\n<br />[*]  Enhanced Combat AI Magic Usage - Implemented\n<br />[*]  Complex Backstory and Quests - Work-in-Progress - Subject to Revision and Expansion\n<br />[/list]\n<br />\n<br />[center][size=5][size=5][img]https://staticdelivery.nexusmods.com/mods/1704/images/26983/26983-1579287668-1794234529.png[/img][/size]Arcane Research[size=5][img]https://staticdelivery.nexusmods.com/mods/1704/images/26983/26983-1579287680-584144625.png[/img][/size][/size][/center]\n<br />\n<br />    As an inquisitive College Mage, Lielle will occasionally ask the player to study certain artifacts they find in their adventures. These quests are optional, and can be put off until later, if the player wishes. There are a few things pertaining to this feature the player must bear in mind:\n<br />\n<br />[list]\n<br />[*]Lielle will not perform any research tasks while she is an active follower, and conversely cannot be recruited while actively performing research.\n<br />[*]Lielle will take some time to complete her research. Easier research quests will take somewhere between 12 hours and 32 hours, while harder research quests can take as long as 96 hours. (All in-game time. Changing the game's time-scale may have unintended effects.)\n<br />[*]A dialogue option exists to reduce the time research takes. Under the topic \"About your research...\"\n<br />[*]Players have the option to decline requests to study an artifact until the player is ready to hand it over. Active research requests can be resumed via the \"About your research...\" topic.   \n<br />[*]Players can simply wait until Lielle is finished researching, but it's recommended to use the time getting to know other followers, complete side-quests, and otherwise do other things.   \n<br />[*]Lielle will not directly tell you when she is finished a research task, because she's often more focused on her studies and work. You can see if she's finished research with the topic \"How is your research going?\" -- Asking her repetitively may annoy her, though... \n<br />[*]As of 0.4.0 and later, Arcane Research Quests will be tracked in the quest journal, with objectives to indicate when Lielle has completed a research task.\n<br />[/list]\n<br />    The Arcane Research Quest centering around the Gauldur Amulet (and its fragment found in Saarthal) serves as an introduction to this feature, and is best experienced if you bring Lielle along to gather the other two fragments, if not previously acquired. You have the option to skip studying the Saarthal Amulet Fragment by reading \"Lost Legends\" before speaking to Lielle. \n<br />\n<br />    Completing research tasks has several rewards. Firstly, the player will receive an artifact-specific reward that can be a new spell or improved version of the original artifact, or an unlocked version of the enchantment the original item has. No quest items are lost, with the exception of the Gauldur Amulet, which is replaced with a more powerful version. NOTE: Legacy of the Dragonborn users are encouraged to make replicas of research artifacts before having Lielle study them. Items are always returned to the player, in most circumstances, but bugs can and will probably happen, being that this is a beta release. Users are also encouraged to save before accepting any research request from Lielle. Additionally, Lielle will gain experience toward an exclusive \"Study Rank\", which has it's own benefits:\n<br />\n<br />[list]\n<br />[*]  Every full level of Study Rank will grant Lielle an additional 10 magicka\n<br />[*]  Every 10 levels of Study Rank will grant Lielle a vanilla perk.\n<br />[/list]\n<br />    Study Rank currently caps at level 50, but I may extend this at a later time. I may also consider alternative patches for users of perk mods like Vorkii or Ordinator. \n<br />\n<br />    Finally, completing research tasks will not only increase the player's standing with Lielle, but choices available in dialogue can also increase that standing. This is a feature I call \"Affection Level\", which players may notice is functionally similar to the Affinity Rating found in Fallout 4, and is also a per-requisite to Lielle's marriage quest. This leads naturally into the next feature:\n<br />\n<br />\n<br />[center][size=5][size=5][img]https://staticdelivery.nexusmods.com/mods/1704/images/26983/26983-1579287668-1794234529.png[/img][/size][/size][size=5]Romance System[/size][size=5][img]https://staticdelivery.nexusmods.com/mods/1704/images/26983/26983-1579287680-584144625.png[/img][/size][/center]\n<br />\n<br />    Players love a good romance, right? One of the frequent complaints of Bethesda fans is the fact that marriage mechanics in the base game feel slapped on and gimmicky. Most NPCs who are eligible to be married all behave the same way, and all pretty much agree to marry you as soon as you learn about how romance \"works\" in the cultural context and wear a piece of jewelry. It isn't very accurate to the complexity of emotions, and makes the world feel flat. Lielle seeks to avert this by incorporating the \"Affection Level\" mentioned above, as well as other requirements the player must meet before she will agree to marry them. This also involves Lielle's backstory quest, which has been implemented in a preliminary fashion. These features are currently in revision stage, and will be expanded in future releases. Lielle's affection toward the player is affected in several ways:\n<br /> [list]  [*]As a consequence of specific actions the player may perform in game. This works both ways. You can make her upset with you if you do things she doesn't like. This will be subject to expansion and revision\n<br /> [*]  Via dialogue choices in quest-specific and aforementioned research quest dialogues. \n<br /> [*]  Completing certain quests.\n<br />[/list]\n<br />\n<br />    This feature, as previously stated, is still in development and will be expanded in different ways in future releases. The existing functionality exists as a basic framework for me to build on.\n<br />[center]\n<br />\n<br />[size=5][size=5][size=5][img]https://staticdelivery.nexusmods.com/mods/1704/images/26983/26983-1579287668-1794234529.png[/img][/size][/size]Multi-Follower Interaction[size=5][img]https://staticdelivery.nexusmods.com/mods/1704/images/26983/26983-1579287680-584144625.png[/img][/size][/size][/center]\n<br />\n<br />    With the advent of follower framework mods such as EFF and Nether's Follower Framework, the player often accrues a small (or possibly very large) group of characters that they enjoy adventuring with. As such, it's rewarding when the player can observe these often disparate personality types interact with one another. This is one of the design goals of Lielle, and is still in-development. Lielle will engage certain vanilla followers in idle conversations when the player has told the party to \"relax\" or they have gone into sandbox mode via features in the above mods. More characters will be included in this feature in future releases, with eventual expansion into modded standalone followers, with both a shortlist of planned personal favorites, as well as by popular request.\n<br />\n<br />    NOTE: These conversation options are restricted by reliance on vanilla dialogue, which does not offer much freedom in terms of writing. Please be patient as I dig through the voice files to find usable and appropriate lines for use.\n<br />\n<br />\n<br />\n<br />[center][size=5][size=5][size=5][img]https://staticdelivery.nexusmods.com/mods/1704/images/26983/26983-1579287668-1794234529.png[/img][/size][/size]Quest-Aware Dialogue[size=5][img]https://staticdelivery.nexusmods.com/mods/1704/images/26983/26983-1579287680-584144625.png[/img][/size][/size][/center]\n<br />\n<br />    Lielle is not a dunce. She is intended to be an insightful and intelligent character in the player's travels. As such, she will occasionally have something to say about the things happening around her. These comments may be as simple as humorous quips, or bits of lore and history that aren't really explored as much in the game. At the time of this release, most of that dialogue centers around the College of Winterhold questline, and even represents a sort of miniature character arc for Lielle, herself, as she responds more with more complexity to events of that quest line. Future vanilla quest lines will be subjects for expansion of this feature, with the Main Quest being the next planned target. Some of these dialogues may be blocking topics or force-greets, but not all of them are. The player can see what she has to say by looking for the topic \"Something on your mind?\"\n<br />\n<br />\n<br />[center][size=5][size=5][size=5][size=5][img]https://staticdelivery.nexusmods.com/mods/1704/images/26983/26983-1579287668-1794234529.png[/img][/size][/size][/size]Enhanced Combat AI[size=5][size=5][img]https://staticdelivery.nexusmods.com/mods/1704/images/26983/26983-1579287680-584144625.png[/img][/size][/size]\n<br />[/size][/center]\n<br />    Through clever use of combat override packages, I have given Lielle the ability to target the player with healing magic (&lt;50% player health), or herself (&lt;30% health). This feature is in a preliminary stage, and may be altered in future releases. Furthermore, Lielle's combat AI is also enhanced via the use of a scripted spell-selection feature that will change what magic she might use in combat. This feature is borrowed and adapted from the \"[url=https://www.nexusmods.com/skyrim/mods/87480]Deadwood Poison Spriggan Follower[/url]\" by PyroToaster.\n<br />\n<br />   As of version 0.4.0, Lielle is tested functional within Nether's Follower Framework, and can be set as a party healer via NFF's MCM. As such, I have added a toggle to Lielle's MCM to disable her native healing packages. \n<br />\n<br />\n<br />\n<br />[center][size=5][size=5][size=5][size=5][img]https://staticdelivery.nexusmods.com/mods/1704/images/26983/26983-1579287668-1794234529.png[/img][/size][/size][/size]Personality and Alignment[size=5][size=5][size=5][img]https://staticdelivery.nexusmods.com/mods/1704/images/26983/26983-1579287680-584144625.png[/img][/size][/size][/size][/size][/center]\n<br />\n<br />    Lielle has been built and written in such a way as to give her a unique and interesting personality. She is highly intellectually-motivated and curious about the world around her. She has had experiences in her past (as revealed via dialogue and backstory quest(s)) that have shaped her emotional state and given her a well-defined moral compass. She does not actively impose her morality onto others, but she will react in ways that reflect her morality, both in regards to the player's actions as well as the actions and background of other characters she and the player may interact with. Her moral alignment is best defined as \"Neutral Good\", at this time. In future releases, I may introduce mechanics to change her morality, for evil character role-play purposes.\n<br />\n<br />\n<br />\n<br />[center][size=5][size=5][size=5][size=5][img]https://staticdelivery.nexusmods.com/mods/1704/images/26983/26983-1579287668-1794234529.png[/img][/size][/size][/size] Unique Appearance[size=5][size=5][size=5][img]https://staticdelivery.nexusmods.com/mods/1704/images/26983/26983-1579287680-584144625.png[/img][/size][/size][/size][/size][/center]\n<br />\n<br />    Lielle's physical appearance is the result of spending copious hours in RaceMenu, downloading various appearance, hair and facetint mods, and otherwise doing his utmost to make Lielle a semi-believable, objectively appealing character. Her appearance incorporates several mods, including Fair Skin Complexion, CBBE Curvy, Frecklemania, KS Hairdos, and UNP Tattoos. The FOMOD installer includes options for SFW and NSFW body types, as well as a highly-optional, non-recommended vanilla body shape, for players who do not have a skeleton replacer, or otherwise object to body replacer mods. Lielle's appearance and textures in considered to be in a finalized state, to avoid the consequences of grey face bugs and neck gaps.\n<br />\n<br />    [s]NOTE: Players are able to replace Lielle's body shape with their own custom body, if they so choose. Failing to do this properly may cause Lielle's tattoos to disappear, and/or face-body texture mismatch. This practice is not fully-supported, and a basic guide will be added to the Articles section of this modpage, at some time in the future. Familiarity with NifSkope and BodySlide is recommended in doing this. Note that UUNP-derived body shapes may cause issues with her custom textures. I will consider adding an optional UUNP-based texture set, in the future. [/s]\n<br />\n<br />   ﻿In a future release version, I plan to include BodySlide files for Lielle's custom body and default outfit, as well as an updated preset, so that players can customize outfits to fit her.\n<br />\n<br />[center][size=5][size=5][size=5][size=5][img]https://staticdelivery.nexusmods.com/mods/1704/images/26983/26983-1579287668-1794234529.png[/img][/size][/size][/size]Compatibility Notes[size=5][size=5][size=5][img]https://staticdelivery.nexusmods.com/mods/1704/images/26983/26983-1579287680-584144625.png[/img][/size][/size][/size]\n<br />[/size][/center]\n<br />\n<br />    Lielle has been built with compatibility with a large variety of mods in mind. However, I can't guarantee full compatibility with mods that significantly alter major quest lines like the College of Winterhold quest line. Be aware that specific commentaries may not fire, or fire out-of-place in such cases. I will eventually work toward testing specific mods for any compatibility issues that may exist. Lielle's framework is built to interface with the DialogueFollower quest externally via a simple helper script, making her theoretically capable of working with most follower utility mods, such as Nether's Follower Framework. An optional patch is included for users of Extensible Follower Framework, to force her into that system, instead.\n<br />\n<br />    In regards to College of Winterhold Overhauls; due to the minor edits I make to the Hall of Attainment, Arcanaeum and Hall of Elements, other mods that edit those cells may have unexpected and undesirable consequences. I have included optional patches in the FOMOD for Immersive College of Winterhold, Magical College of Winterhold and Obscure's College of Winterhold, to blend changes from both Lielle and the respective College overhauls. These patches are currently in an experimental stage. Any bugs or inconsistencies should be reported clearly with attention given to specific load-order. It is recommended that you load College editing mods first, then Lielle, then any respective patches, to minimize issues.\n<br />\n<br />\n<br />[center][size=5][size=5][size=5][size=5][img]https://staticdelivery.nexusmods.com/mods/1704/images/26983/26983-1579287668-1794234529.png[/img][/size][/size][/size][/size][size=5]Installation[size=5][size=5][size=5][img]https://staticdelivery.nexusmods.com/mods/1704/images/26983/26983-1579287680-584144625.png[/img][/size][/size][/size][/size][/center]\n<br />\n<br />\n<br />    NOTE 1: This mod is packaged as a FOMOD installer, to incorporate optional choices and additional patches I have created. Manual installation is not recommended. I reserve the option to decline support to those who choose not to use a mod manager like Mod Organizer 2 or even Vortex in the modern age of &lt;current year&gt;.\n<br />\n<br />[b]\n<br />    Installation:[/b]\n<br />\n<br />    [/b]Download the FOMOD and install using your preferred mod manager. Really. That's it.\n<br />[b]\n<br />    [b]Uninstallation: [/b]\n<br />\n<br />    [size=5]WE NEVER REMOVE SCRIPTED MODS FROM AN ACTIVE SAVE. THIS OFTEN BREAKS SAVES, EVEN WITH SAVE CLEANING TOOLS. [/size]\n<br />\n<br />[/b]"
